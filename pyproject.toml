[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octsim"
version = "0.2.0"
description = "Physically-modelled OCT simulation platform (per-spectrum forward model, 3D retinal anatomy, GUI + API)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eric Tang" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13", "matplotlib>=3.7"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[project.scripts]
octsim = "octsim.gui.app:main"

[tool.setuptools.packages.find]
include = ["octsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
