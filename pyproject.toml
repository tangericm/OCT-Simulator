[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octsim"
version = "0.1.0"
description = "Physically-modelled OCT B-scan synthesizer (per-spectrum forward model)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eric Tang" }]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["octsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
